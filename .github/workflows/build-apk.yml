name: Build Android APK

on:
  # タグ push で自動ビルド（例: git tag v1.0.0 && git push --tags）
  push:
    tags:
      - 'v*'
  # 手動トリガー
  workflow_dispatch:
    inputs:
      create_release:
        description: 'GitHub Release を作成する'
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ─────────────────────────────────────────────
      # 1. 環境セットアップ
      # ─────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'

      # ─────────────────────────────────────────────
      # 2. サイト URL を決定
      # ─────────────────────────────────────────────
      - name: Determine site URL
        id: site
        run: |
          OWNER="${{ github.repository_owner }}"
          REPO="${{ github.event.repository.name }}"
          # vars.SITE_URL があればそれを優先
          if [ -n "${{ vars.SITE_URL }}" ]; then
            URL="${{ vars.SITE_URL }}"
          else
            URL="https://${OWNER}.github.io/${REPO}"
          fi
          HOST=$(echo "$URL" | sed 's|https://||' | cut -d'/' -f1)
          echo "url=$URL"   >> $GITHUB_OUTPUT
          echo "host=$HOST" >> $GITHUB_OUTPUT
          echo "Site URL: $URL"

      # ─────────────────────────────────────────────
      # 3. Android プロジェクトを設定
      # ─────────────────────────────────────────────
      - name: Patch strings.xml with site URL
        run: |
          sed -i "s|SITE_URL_PLACEHOLDER|${{ steps.site.outputs.url }}/|g" \
            android/app/src/main/res/values/strings.xml
          sed -i "s|SITE_HOST_PLACEHOLDER|${{ steps.site.outputs.host }}|g" \
            android/app/src/main/res/values/strings.xml

      - name: Copy PWA icons to Android mipmap directories
        run: |
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p "android/app/src/main/res/mipmap-${d}"
          done
          # Python + Pillow でリサイズ（ImageMagick 不要）
          pip install --quiet Pillow
          python3 - <<'PYEOF'
          from PIL import Image
          import shutil, os
          src = "coopet-pwa/icons/icon-512x512.png"
          res = "android/app/src/main/res"
          sizes = {
            "mipmap-mdpi":    48,
            "mipmap-hdpi":    72,
            "mipmap-xhdpi":   96,
            "mipmap-xxhdpi":  144,
            "mipmap-xxxhdpi": 192,
          }
          img = Image.open(src).convert("RGBA")
          for dpi, size in sizes.items():
            resized = img.resize((size, size), Image.LANCZOS)
            for name in ["ic_launcher.png", "ic_launcher_round.png"]:
              out = os.path.join(res, dpi, name)
              resized.save(out)
              print(f"Created {out} ({size}x{size})")
          PYEOF

      # ─────────────────────────────────────────────
      # 4. Gradle wrapper を生成
      # ─────────────────────────────────────────────
      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.6
        working-directory: android

      # ─────────────────────────────────────────────
      # 5. キーストアのセットアップ
      # ─────────────────────────────────────────────
      - name: Set up release keystore
        id: keystore
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/coopet.keystore
            echo "mode=release" >> $GITHUB_OUTPUT
            echo "Release keystore decoded."
          else
            echo "mode=debug" >> $GITHUB_OUTPUT
            echo "No KEYSTORE_BASE64 secret — building debug APK."
          fi

      # ─────────────────────────────────────────────
      # 6. ビルド
      # ─────────────────────────────────────────────
      - name: Build release APK
        if: steps.keystore.outputs.mode == 'release'
        working-directory: android
        run: |
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$(pwd)/coopet.keystore \
            -Pandroid.injected.signing.store.password="${{ secrets.KEYSTORE_PASSWORD }}" \
            -Pandroid.injected.signing.key.alias="${{ secrets.KEY_ALIAS }}" \
            -Pandroid.injected.signing.key.password="${{ secrets.KEY_PASSWORD }}"

      - name: Build debug APK
        if: steps.keystore.outputs.mode == 'debug'
        working-directory: android
        run: ./gradlew assembleDebug

      # ─────────────────────────────────────────────
      # 7. 成果物のアップロード
      # ─────────────────────────────────────────────
      - name: Find APK
        id: apk
        run: |
          APK=$(find android/app/build/outputs/apk -name '*.apk' | head -1)
          echo "path=$APK" >> $GITHUB_OUTPUT
          echo "APK: $APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CooPet-APK
          path: ${{ steps.apk.outputs.path }}
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.create_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: CooPet ${{ github.ref_name }}
          files: ${{ steps.apk.outputs.path }}
          generate_release_notes: true
