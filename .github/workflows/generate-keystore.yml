name: Generate Release Keystore (Run Once)

on:
  workflow_dispatch:
    inputs:
      key_alias:
        description: 'キーのエイリアス名'
        default: 'coopet'
        required: true
      store_password:
        description: 'キーストアのパスワード（8文字以上）'
        required: true
      key_password:
        description: 'キーのパスワード（8文字以上）'
        required: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate keystore
        run: |
          keytool -genkey -v \
            -keystore coopet.keystore \
            -alias "${{ inputs.key_alias }}" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "${{ inputs.store_password }}" \
            -keypass "${{ inputs.key_password }}" \
            -dname "CN=CooPet, OU=App, O=CooPet, L=Tokyo, S=Tokyo, C=JP"

      - name: Print KEYSTORE_BASE64 (→ GitHub Secret に追加)
        run: |
          echo "=============================================="
          echo "以下の値を GitHub Secret 'KEYSTORE_BASE64' に設定してください"
          echo "=============================================="
          base64 -w 0 coopet.keystore
          echo ""

      - name: Print SHA256 fingerprint (→ GitHub Secret に追加)
        run: |
          echo "=============================================="
          echo "以下の SHA256 値を GitHub Secret 'RELEASE_FINGERPRINT' に設定してください"
          echo "=============================================="
          keytool -list -v \
            -keystore coopet.keystore \
            -alias "${{ inputs.key_alias }}" \
            -storepass "${{ inputs.store_password }}" \
            | grep "SHA256:" | head -1 | awk '{print $2}'

      - name: Upload keystore as artifact (1日間保存)
        uses: actions/upload-artifact@v4
        with:
          name: coopet-keystore
          path: coopet.keystore
          retention-days: 1
